# The Arc founder demo on Fly.io (deploy/fly/README.md). Deploy from the
# repository root, which is the build context; the root .dockerignore is an
# allowlist, so only the demo's code is uploaded:
#
#   fly deploy --ha=false --build-arg FUEL_COMMIT=$(git rev-parse --short HEAD)
#
# ONE machine, always on: deploy with `--ha=false` and check `fly status`
# shows one. The ledger in /data is the only thing that enforces the agent's
# $5 lifetime limit, and two machines would mean two ledgers. Never
# `fly scale count 2` or `fly machine clone` this app.
app = "fuel-arc-demo"
primary_region = "sin"

[build]
  dockerfile = "deploy/fly/Dockerfile"
  ignorefile = ".dockerignore"

[env]
  TRYIT_ALLOWED_ORIGIN = "https://vasanog.github.io"
  # On the volume, so a restart keeps today's cap and a pause stays paused.
  # Set here (not only in the entrypoint) so an `fly ssh console` session
  # running demo/try-it/control.ts sees the same paths the door does.
  TRYIT_PAUSE_FILE = "/data/tryit/tryit.paused"
  TRYIT_LOG_FILE = "/data/tryit/tryit-log.jsonl"
  TRYIT_DOOR_URL = "http://127.0.0.1:3220"

[[mounts]]
  source = "fuel_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3220
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
