# The Arc founder demo on Fly.io. Deploy from the repository root:
#
#   fly deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile \
#     --build-arg FUEL_COMMIT=$(git rev-parse --short HEAD)
#
# ONE machine, always on. The ledger in /data is the only thing that enforces
# the agent's $5 lifetime limit, and two machines would mean two ledgers.
app = "fuel-arc-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  TRYIT_ALLOWED_ORIGIN = "https://vasanog.github.io"

[[mounts]]
  source = "fuel_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3220
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
